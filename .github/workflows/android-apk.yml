name: Build Jayesh Library APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          unzip -q JayeshLibrary-GitHub-Build-Ready.zip -d source

      - name: Build APK
        run: |
          gradle -p source/JayeshLibrary :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Jayesh-Library-APK
          path: source/JayeshLibrary/app/build/outputs/apk/debug/app-debug.apk
